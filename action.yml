name: 'Limina AI CI/CD Regression Gate'
description: 'Deterministic factual accuracy regression testing and automated PR gating for AI agents.'
author: 'Limina AI'
branding:
  icon: 'shield'
  color: 'gray-dark'

inputs:
  api-key:
    description: 'Limina AI Secret API Key (limina_live_...)'
    required: true
  baseline:
    description: 'Path to baseline golden trajectories dataset (JSON)'
    required: true
  candidate:
    description: 'Path to candidate evaluation trajectories dataset (JSON)'
    required: true
  fail-on-regression:
    description: 'Block PR merge if new regressions are detected (exit code 1)'
    required: false
    default: 'true'
  github-token:
    description: 'GitHub Token for posting automated PR comments (defaults to GITHUB_TOKEN)'
    required: false
    default: ${{ github.token }}
  comment-on-pr:
    description: 'Automatically post/update the regression diff report on the Pull Request'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Limina SDK
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade limina-ai

    - name: Execute Limina Regression Diff Engine
      shell: bash
      env:
        LIMINA_API_KEY: ${{ inputs.api-key }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_CANDIDATE: ${{ inputs.candidate }}
        INPUT_FAIL_ON_REGRESSION: ${{ inputs.fail-on-regression }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_COMMENT_ON_PR: ${{ inputs.comment-on-pr }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        python ${{ github.action_path }}/ci_entrypoint.py